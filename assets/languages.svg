<svg xmlns="http://www.w3.org/2000/svg" width="960" height="386" viewBox="0 0 960 386" role="img" aria-labelledby="title description"><title id="title">4booser / repository languages</title><desc id="description">Share of code bytes, not skill levels. Public owned non-fork non-archived repositories; the profile repository is excluded.</desc><style>text{font-family:'DejaVu Sans Mono','SFMono-Regular',Consolas,monospace}.cursor{animation:blink 1.2s steps(1,end) infinite}@keyframes blink{50%{opacity:0}}@media(prefers-reduced-motion:reduce){.cursor{animation:none}}</style><rect x="0" y="0" width="960" height="386" fill="#0b100c"></rect><rect x=".5" y=".5" width="959" height="385" fill="none" stroke="#29392c"/><text x="24" y="35" font-size="20" fill="#b7eb8f" font-weight="400" text-anchor="start">$ du --languages --public</text><text x="24" y="66" font-size="14" fill="#91a48e" font-weight="400" text-anchor="start">code bytes / public + owned / no forks / no archived repos / no profile repo</text><text x="24" y="112" font-size="18" fill="#dce9d1" font-weight="400" text-anchor="start">TypeScript</text><text x="932" y="112" font-size="17" fill="#91a48e" font-weight="400" text-anchor="end">86.4%</text><rect x="246" y="97" width="590" height="17" fill="#19251c"></rect><rect x="246" y="97" width="510.012" height="17" fill="#b7eb8f"></rect><text x="24" y="155" font-size="18" fill="#dce9d1" font-weight="400" text-anchor="start">C#</text><text x="932" y="155" font-size="17" fill="#91a48e" font-weight="400" text-anchor="end">8.8%</text><rect x="246" y="140" width="590" height="17" fill="#19251c"></rect><rect x="246" y="140" width="51.956" height="17" fill="#b7eb8f"></rect><text x="24" y="198" font-size="18" fill="#dce9d1" font-weight="400" text-anchor="start">JavaScript</text><text x="932" y="198" font-size="17" fill="#91a48e" font-weight="400" text-anchor="end">2.7%</text><rect x="246" y="183" width="590" height="17" fill="#19251c"></rect><rect x="246" y="183" width="15.854" height="17" fill="#b7eb8f"></rect><text x="24" y="241" font-size="18" fill="#dce9d1" font-weight="400" text-anchor="start">Shell</text><text x="932" y="241" font-size="17" fill="#91a48e" font-weight="400" text-anchor="end">0.8%</text><rect x="246" y="226" width="590" height="17" fill="#19251c"></rect><rect x="246" y="226" width="4.639" height="17" fill="#b7eb8f"></rect><text x="24" y="284" font-size="18" fill="#dce9d1" font-weight="400" text-anchor="start">CSS</text><text x="932" y="284" font-size="17" fill="#91a48e" font-weight="400" text-anchor="end">0.7%</text><rect x="246" y="269" width="590" height="17" fill="#19251c"></rect><rect x="246" y="269" width="4.023" height="17" fill="#b7eb8f"></rect><text x="24" y="327" font-size="18" fill="#dce9d1" font-weight="400" text-anchor="start">Other</text><text x="932" y="327" font-size="17" fill="#91a48e" font-weight="400" text-anchor="end">0.6%</text><rect x="246" y="312" width="590" height="17" fill="#19251c"></rect><rect x="246" y="312" width="3.517" height="17" fill="#b7eb8f"></rect><text x="24" y="366" font-size="14" fill="#91a48e" font-weight="400" text-anchor="start">repository content != proficiency</text></svg>
