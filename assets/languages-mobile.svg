<svg xmlns="http://www.w3.org/2000/svg" width="480" height="528" viewBox="0 0 480 528" role="img" aria-labelledby="title description"><title id="title">4booser / repository languages</title><desc id="description">Share of code bytes, not skill levels. Public owned non-fork non-archived repositories; the profile repository is excluded.</desc><style>text{font-family:'DejaVu Sans Mono','SFMono-Regular',Consolas,monospace}.cursor{animation:blink 1.2s steps(1,end) infinite}@keyframes blink{50%{opacity:0}}@media(prefers-reduced-motion:reduce){.cursor{animation:none}}</style><rect x="0" y="0" width="480" height="528" fill="#0b100c"></rect><rect x=".5" y=".5" width="479" height="527" fill="none" stroke="#29392c"/><text x="24" y="35" font-size="20" fill="#b7eb8f" font-weight="400" text-anchor="start">$ du --languages --public</text><text x="24" y="66" font-size="16" fill="#91a48e" font-weight="400" text-anchor="start">code bytes / no forks / no profile repo</text><text x="24" y="112" font-size="19" fill="#dce9d1" font-weight="400" text-anchor="start">TypeScript</text><text x="456" y="112" font-size="18" fill="#91a48e" font-weight="400" text-anchor="end">86.4%</text><rect x="24" y="125" width="432" height="12" fill="#19251c"></rect><rect x="24" y="125" width="373.432" height="12" fill="#b7eb8f"></rect><text x="24" y="175" font-size="19" fill="#dce9d1" font-weight="400" text-anchor="start">C#</text><text x="456" y="175" font-size="18" fill="#91a48e" font-weight="400" text-anchor="end">8.8%</text><rect x="24" y="188" width="432" height="12" fill="#19251c"></rect><rect x="24" y="188" width="38.042" height="12" fill="#b7eb8f"></rect><text x="24" y="238" font-size="19" fill="#dce9d1" font-weight="400" text-anchor="start">JavaScript</text><text x="456" y="238" font-size="18" fill="#91a48e" font-weight="400" text-anchor="end">2.7%</text><rect x="24" y="251" width="432" height="12" fill="#19251c"></rect><rect x="24" y="251" width="11.609" height="12" fill="#b7eb8f"></rect><text x="24" y="301" font-size="19" fill="#dce9d1" font-weight="400" text-anchor="start">Shell</text><text x="456" y="301" font-size="18" fill="#91a48e" font-weight="400" text-anchor="end">0.8%</text><rect x="24" y="314" width="432" height="12" fill="#19251c"></rect><rect x="24" y="314" width="3.396" height="12" fill="#b7eb8f"></rect><text x="24" y="364" font-size="19" fill="#dce9d1" font-weight="400" text-anchor="start">CSS</text><text x="456" y="364" font-size="18" fill="#91a48e" font-weight="400" text-anchor="end">0.7%</text><rect x="24" y="377" width="432" height="12" fill="#19251c"></rect><rect x="24" y="377" width="2.945" height="12" fill="#b7eb8f"></rect><text x="24" y="427" font-size="19" fill="#dce9d1" font-weight="400" text-anchor="start">Other</text><text x="456" y="427" font-size="18" fill="#91a48e" font-weight="400" text-anchor="end">0.6%</text><rect x="24" y="440" width="432" height="12" fill="#19251c"></rect><rect x="24" y="440" width="2.575" height="12" fill="#b7eb8f"></rect><text x="24" y="508" font-size="16" fill="#91a48e" font-weight="400" text-anchor="start">repository content != proficiency</text></svg>
