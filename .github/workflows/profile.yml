name: Refresh profile

on:
  push:
    branches: [main]
    paths: ["scripts/**", ".github/workflows/profile.yml"]
  pull_request:
    branches: [main]
    paths: ["scripts/**", ".github/workflows/profile.yml"]
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: profile-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      # Renders every design from the committed snapshot: catches broken renderers without the API.
      - run: node scripts/build.mjs --all --dry-run

  refresh:
    needs: validate
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24

      # The default token sees public repositories only, which is what the profile shows.
      - name: Fetch stats
        run: node scripts/fetch-stats.mjs
        env:
          GITHUB_TOKEN: ${{ github.token }}

      - name: Render images
        run: node scripts/build.mjs

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A data assets README.md
          git diff --cached --quiet && exit 0
          git commit -m "chore: refresh profile stats"
          git push
